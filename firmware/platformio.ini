; PlatformIO Project Configuration File
; Proyek: Klasifikasi Aktivitas Manusia Berbasis Edge Inference di ESP32 + PIR + MQTT/TLS/OTA
; Board : ESP32 DevKit V1 pada Bluino ESP32 IoT Starter Shield

[platformio]
src_dir = .

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; Partisi default PlatformIO sudah mendukung OTA (dua slot app)
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit SSD1306 @ ^2.5.11
    adafruit/Adafruit GFX Library @ ^1.11.9
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
